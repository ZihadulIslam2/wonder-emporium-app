# Codemagic CI/CD configuration for Wonder Mobile (Expo / React Native)
# Documentation: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/

workflows:
  react-native-ios:
    name: Wonder Mobile iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic # Configure under: Team settings > Developer Portal > Manage keys
    environment:
      ios_signing:
        distribution_type: app_store # or: ad_hoc | development
        bundle_identifier: Com.zihadul708.wonder
      vars:
        BUNDLE_ID: "Com.zihadul708.wonder"
        XCODE_WORKSPACE: "wondermobile.xcworkspace"
        XCODE_SCHEME: "wondermobile"
        APP_STORE_APPLE_ID: 6806753725
        EXPO_PUBLIC_API_URL: "http://2.25.80.41/api/v1"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --warn-only
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
            if [ -n "$LATEST_BUILD_NUMBER" ]; then
              agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
            else
              agvtool new-version -all $BUILD_NUMBER
            fi
          else
            agvtool new-version -all $BUILD_NUMBER
          fi
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - zihadul708@gmail.com
        notify:
          success: true
          failure: true

  react-native-android:
    name: Wonder Mobile Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      # If you have uploaded an Android keystore to Codemagic (Team settings > Code signing identities),
      # specify its reference name below:
      # android_signing:
      #   - codemagic_keystore
      # groups:
      #   - google_play # If publishing to Google Play with a service account
      vars:
        PACKAGE_NAME: "com.zihadul708.wonder"
        EXPO_PUBLIC_API_URL: "http://2.25.80.41/api/v1"
      node: 22
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Generate Android project
        script: |
          npx expo prebuild --platform android --clean --no-install
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android release
        script: |
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo "")
          if [ -z "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" ]; then
            UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          else
            UPDATED_BUILD_NUMBER=$(($LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
          fi
          cd android
          ./gradlew assembleRelease bundleRelease \
            -PversionCode=$UPDATED_BUILD_NUMBER \
            -PversionName=1.0.$UPDATED_BUILD_NUMBER
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - zihadul708@gmail.com
        notify:
          success: true
          failure: true
